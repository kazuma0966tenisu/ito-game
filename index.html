<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>診断モード - itoっぽい</title>
    <style>
        /* 診断用ログ表示エリア */
        #debug-console {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: rgba(0,0,0,0.9);
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            overflow-y: scroll;
            z-index: 9999;
            border-bottom: 2px solid #d32f2f;
            text-align: left;
        }
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            padding: 20px;
            margin-top: 160px; /* 診断ボックスの分空ける */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="debug-console">診断ログ待機中...<br></div>

    <div id="screen-setup" class="container">
        <h2>設定画面 (診断中)</h2>
        <p>プレイヤー人数</p>
        <input type="number" id="player-count" value="3" style="font-size:16px; padding:10px;">
        
        <div id="name-inputs-container" style="margin:10px 0; background:#eee; padding:10px;">
            </div>

        <button class="btn" onclick="tryStart()">ゲームスタート (診断)</button>
    </div>

    <div id="screen-check" class="container hidden">
        <h2 id="player-turn-text">確認画面</h2>
        <div id="my-number" style="font-size:50px; color:red; font-weight:bold;">?</div>
        <button class="btn" onclick="nextStep()">次へ</button>
    </div>

    <script>
        // --- 診断用ロガー ---
        function log(msg) {
            const box = document.getElementById('debug-console');
            const time = new Date().toLocaleTimeString();
            box.innerHTML += `[${time}] ${msg}<br>`;
            box.scrollTop = box.scrollHeight;
        }

        // エラーをキャッチする設定
        window.onerror = function(msg, url, line) {
            log(`❌ エラー発生!: ${msg} (Line: ${line})`);
            return false;
        };

        // --- ゲーム処理 ---
        let players = [];
        let index = 0;

        window.onload = function() {
            log("✅ ページ読み込み完了");
            try {
                const input = document.getElementById('player-count');
                if(input) {
                    log("OK: 人数入力欄が見つかりました");
                    input.addEventListener('input', generateInputs);
                    generateInputs();
                } else {
                    log("❌ ERROR: 人数入力欄が見つかりません");
                }
            } catch(e) {
                log("❌ 初期化エラー: " + e.message);
            }
        };

        function generateInputs() {
            log("処理: 名前入力欄を生成します");
            const count = document.getElementById('player-count').value;
            const area = document.getElementById('name-inputs-container');
            area.innerHTML = "";
            for(let i=1; i<=count; i++) {
                area.innerHTML += `<div style='margin:5px;'>プレイヤー${i}</div>`;
            }
        }

        // グローバル関数として定義
        window.tryStart = function() {
            log("ボタン: 「ゲームスタート」が押されました");
            try {
                const count = document.getElementById('player-count').value;
                log(`設定人数: ${count}人`);
                
                // 画面切り替えテスト
                document.getElementById('screen-setup').classList.add('hidden');
                document.getElementById('screen-check').classList.remove('hidden');
                
                // カード配布テスト
                const num = Math.floor(Math.random() * 100) + 1;
                document.getElementById('my-number').innerText = num;
                document.getElementById('player-turn-text').innerText = "プレイヤー1の番";
                
                log("成功: 画面が切り替わりました");
            } catch(e) {
                log("❌ スタート処理エラー: " + e.message);
            }
        };

        window.nextStep = function() {
            log("ボタン: 「次へ」が押されました");
            alert("ボタンは正常に反応しています！");
            location.reload();
        };
    </script>
</body>
</html>
