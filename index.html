<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itoっぽいの</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { color: #d32f2f; margin-bottom: 10px; }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .btn:active { background-color: #b71c1c; }
        
        /* 補助ボタン */
        .btn-outline {
            background-color: white;
            border: 2px solid #d32f2f;
            color: #d32f2f;
            margin-top: 10px;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-gray {
            background-color: #888;
            border: none;
            color: white;
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .hidden { display: none !important; }
        
        /* カードスタイル */
        .card-display {
            background: linear-gradient(135deg, #ff5252, #b71c1c);
            color: white;
            width: 150px;
            height: 220px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 5px solid white;
        }
        
        /* お題ボックス */
        .theme-box {
            background-color: #ffebee;
            border: 2px dashed #d32f2f;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
        }
        .theme-title { font-size: 14px; color: #d32f2f; font-weight: bold; }
        .theme-text { font-size: 22px; font-weight: bold; margin-top: 5px; word-break: break-all; }
        .theme-example {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.7);
            padding: 8px;
            border-radius: 5px;
        }
        .ex-item { text-align: center; flex: 1; }
        .ex-val { font-weight: bold; color: #d32f2f; display: block; font-size: 12px; }

        /* 入力エリア */
        .input-group { margin: 15px 0; text-align: left; }
        .input-group label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px;}
        input[type="number"], input[type="text"], select {
            padding: 10px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
            background-color: #fff;
        }
        
        /* 名前入力リスト */
        #name-inputs-container {
            margin-bottom: 15px;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 5px;
            background: #fafafa;
        }
        .name-row { margin-bottom: 8px; }

        /* モード選択 */
        .mode-select {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .mode-label {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            background: #fff;
        }
        input[type="radio"]:checked + .mode-label {
            background-color: #ffebee;
            border-color: #d32f2f;
            color: #d32f2f;
            font-weight: bold;
        }
        input[type="radio"] { display: none; }

        /* サブフォーム（追加・管理画面） */
        .sub-form {
            background: #fff;
            border: 2px solid #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: left;
        }
        .sub-header {
            font-weight: bold; color: #d32f2f; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px;
        }

        /* テーマ管理リスト */
        .manage-list {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 10px;
            border: 1px solid #eee;
            border-radius: 5px;
        }
        .manage-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            background: #fff;
        }
        .manage-check { margin-right: 10px; transform: scale(1.3); }
        .manage-title { flex: 1; font-size: 14px; margin-right: 10px;}
        .btn-delete {
            background-color: #333;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* 結果リスト */
        .result-list {
            list-style: none;
            padding: 0;
            text-align: left;
        }
        .result-item {
            background: #fff;
            border-bottom: 1px solid #eee;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-rank { font-weight: bold; color: #d32f2f; margin-right: 10px;}
        .result-num { 
            background: #d32f2f; color: white; 
            padding: 5px 10px; border-radius: 5px; font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>itoっぽいの</h1>

    <div id="screen-setup" class="container">
        
        <div class="input-group">
            <label>プレイヤー人数</label>
            <input type="number" id="player-count" value="3" min="2" max="10">
        </div>

        <div class="input-group">
            <label>プレイヤー名設定 (任意)</label>
            <div id="name-inputs-container">
                </div>
        </div>

        <div class="input-group">
            <label>お題の決め方</label>
            <div class="mode-select">
                <label>
                    <input type="radio" name="themeMode" value="random" checked onclick="toggleThemeSelect()">
                    <span class="mode-label">ランダム</span>
                </label>
                <label>
                    <input type="radio" name="themeMode" value="select" onclick="toggleThemeSelect()">
                    <span class="mode-label">リストから選択</span>
                </label>
            </div>
            
            <div id="theme-selector-area" class="hidden">
                <select id="theme-select"></select>
            </div>

            <div class="action-buttons">
                <button class="btn-outline" style="border-color:#555; color:#555;" onclick="toggleManageForm()">⚙ テーマを削除・管理</button>
                <button class="btn-outline" onclick="toggleAddForm()">＋ テーマを新しく追加</button>
            </div>

            <div id="add-theme-area" class="sub-form hidden">
                <div class="sub-header">新しいテーマを追加</div>
                
                <label>テーマ名</label>
                <input type="text" id="new-theme-title" placeholder="例：おふくろの味">
                
                <label>1 (最小) の例</label>
                <input type="text" id="new-theme-min" placeholder="例：ただのゆで卵">
                
                <label>100 (最大) の例</label>
                <input type="text" id="new-theme-max" placeholder="例：特製肉じゃが">

                <div style="display:flex; gap:10px; justify-content: flex-end; margin-top:10px;">
                    <button class="btn-gray" onclick="toggleAddForm()">キャンセル</button>
                    <button class="btn-gray" style="background-color:#d32f2f;" onclick="saveNewTheme()">追加する</button>
                </div>
            </div>

            <div id="manage-theme-area" class="sub-form hidden">
                <div class="sub-header">テーマ管理</div>
                <p style="font-size:12px; margin:0 0 10px 0; color:#666;">
                    チェックを外すとゲームに出ません。<br>
                    「削除」を押すと完全に消えます。
                </p>
                <div id="manage-list-container" class="manage-list">
                    </div>
                <div style="text-align: right; display:flex; justify-content:space-between; margin-top:10px;">
                    <button class="btn-gray" style="font-size:10px;" onclick="resetAllData()">全データ初期化</button>
                    <button class="btn-gray" onclick="toggleManageForm()">閉じる</button>
                </div>
            </div>
        </div>

        <button class="btn" onclick="startGame()">ゲームスタート</button>
    </div>

    <div id="screen-check" class="container hidden">
        <div class="theme-box">
            <div class="theme-title">今回のお題</div>
            <div id="current-theme" class="theme-text">---</div>
            <div id="theme-scale" class="theme-example hidden">
                <div class="ex-item
