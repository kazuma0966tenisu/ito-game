<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>itoっぽいの v8</title>
<style>
    /* 診断バー */
    #sys-check {
        background: #333; color: yellow; padding: 10px; font-size: 12px;
        position: fixed; top: 0; left: 0; width: 100%; z-index: 9999;
        text-align: left; font-family: monospace;
    }
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        color: #333;
        text-align: center;
        padding: 20px;
        margin-top: 50px; /* バーの分空ける */
        display: flex; flex-direction: column; align-items: center;
        min-height: 100vh;
    }
    .container {
        background: white; padding: 20px; border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        max-width: 450px; width: 100%; margin-bottom: 30px;
    }
    .btn {
        background-color: #d32f2f; color: white; border: none;
        padding: 15px; font-size: 18px; border-radius: 30px;
        cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold;
    }
    .btn:active { background-color: #b71c1c; }
    .btn-outline {
        background: white; border: 2px solid #d32f2f; color: #d32f2f;
        padding: 10px; border-radius: 20px; margin-top: 10px; font-weight: bold;
    }
    .hidden { display: none !important; }
    input, select {
        padding: 10px; width: 100%; box-sizing: border-box;
        border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; font-size: 16px;
    }
    .theme-box {
        background: #ffebee; border: 2px dashed #d32f2f; padding: 15px;
        margin: 20px 0; border-radius: 10px;
    }
    .card-display {
        background: linear-gradient(135deg, #ff5252, #b71c1c); color: white;
        width: 160px; height: 240px; margin: 20px auto;
        display: flex; align-items: center; justify-content: center;
        font-size: 80px; font-weight: bold; border-radius: 10px;
        border: 5px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .sub-form {
        background: #fff; border: 2px solid #d32f2f; padding: 15px;
        border-radius: 10px; margin-top: 15px; text-align: left;
    }
    .manage-item {
        display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee;
    }
</style>
</head>
<body>

<div id="sys-check">システム読込中...</div>

<div id="screen-setup" class="container">
    <h2 style="color:#d32f2f; margin-top:0;">itoっぽいの</h2>
    
    <label style="display:block; text-align:left; font-weight:bold;">プレイヤー人数</label>
    <input type="number" id="player-count" value="3" min="2" max="10">

    <label style="display:block; text-align:left; font-weight:bold;">名前設定 (任意)</label>
    <div id="name-inputs"></div>

    <label style="display:block; text-align:left; font-weight:bold; margin-top:10px;">お題の決め方</label>
    <div style="display:flex; gap:10px; margin-bottom:10px;">
        <button id="mode-random" class="btn-outline" style="background:#ffebee; flex:1;" onclick="setMode('random')">ランダム</button>
        <button id="mode-select" class="btn-outline" style="flex:1; color:#666; border-color:#ccc;" onclick="setMode('select')">リスト選択</button>
    </div>
    
    <div id="theme-selector-area" class="hidden">
        <select id="theme-select"></select>
    </div>

    <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
        <button class="btn-outline" style="border-color:#666; color:#666;" onclick="toggleManage()">⚙ テーマ管理・削除</button>
        <button class="btn-outline" onclick="toggleAdd()">＋ テーマ新規追加</button>
    </div>

    <div id="add-form" class="sub-form hidden">
        <b>新しいテーマ</b>
        <input type="text" id="new-t" placeholder="テーマ名">
        <input type="text" id="new-min" placeholder="1の例">
        <input type="text" id="new-max" placeholder="100の例">
        <button class="btn" style="padding:10px; margin-top:5px;" onclick="addTheme()">追加</button>
        <button class="btn-outline" style="border:none; margin-top:0;" onclick="toggleAdd()">閉じる</button>
    </div>

    <div id="manage-form" class="sub-form hidden">
        <b>テーマ管理</b>
        <div id="manage-list" style="max-height:200px; overflow-y:scroll; margin:10px 0;"></div>
        <button class="btn-outline" style="width:100%;" onclick="toggleManage()">閉じる</button>
        <button class="btn-outline" style="width:100%; border:none; color:#888; font-size:12px;" onclick="fullReset()">全データ初期化</button>
    </div>

    <button class="btn" onclick="startGame()">ゲームスタート</button>
</div>

<div id="screen-game" class="container hidden">
    <div class="theme-box">
        <div style="font-size:12px; color:#d32f2f; font-weight:bold;">お題</div>
        <div id="game-theme" style="font-size:24px; font-weight:bold;"></div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:14px;">
            <div style="text-align:center;">1: <b id="game-min"></b></div>
            <div style="text-align:center;">100: <b id="game-max"></b></div>
        </div>
    </div>
    <h2 id="turn-msg"></h2>
    
    <div id="card-area" class="hidden">
        <div class="card-display" id="my-num"></div>
        <p>確認したら「次へ」を押して<br>次の人に渡してください</p>
    </div>

    <button id="btn-action" class="btn" onclick="showNum()">数字を見る</button>
</div>

<div id="screen-result" class="container hidden">
    <h2>結果発表</h2>
    <ul id="res-list" style="text-align:left; padding-left:20px;"></ul>
    <button class="btn" onclick="location.reload()">もう一度遊ぶ</button>
</div>

<script>
// --- エラー監視システム ---
window.onerror = function(msg, url, line) {
    const bar = document.getElementById('sys-check');
    bar.style.background = "red";
    bar.style.color = "white";
    bar.innerHTML = "❌ エラー: " + msg + " (行:" + line + ")";
    return false;
};

// --- ここからゲーム本体 ---
const KEY = 'ito_v8';
let themes = [];
let players = [];
let curIdx = 0;
let mode = 'random';

const defaults = [
    {t:"生き物の強さ", min:"アリ", max:"ライオン"},
    {t:"コンビニ商品の人気", min:"水", max:"からあげクン"},
    {t:"おにぎりの具", min:"塩むすび", max:"いくら"},
    {t:"カバンにあると嬉しい", min:"ゴミ", max:"100万円"},
    {t:"強そうな言葉", min:"ぷよぷよ", max:"撃滅"}
];

// 初期化
window.onload = function() {
    try {
        // データのロード
        const saved = localStorage.getItem(KEY);
        themes = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaults));
        
        // イベント設定
        document.getElementById('player-count').addEventListener('input', renderInputs);
        renderInputs(); // これが動けば入力欄が出る
        updateSelect();

        // 成功サイン
        const bar = document.getElementById('sys-check');
        bar.style.background = "#4CAF50";
        bar.innerHTML = "✅ システム正常: 準備完了";
        setTimeout(() => { bar.style.display = 'none'; }, 2000); // 2秒後に消す
        
    } catch(e) {
        throw e; // エラー監視へ
    }
};

// 名前欄生成
function renderInputs() {
    const num = document.getElementById('player-count').value;
    const div = document.getElementById('name-inputs');
    div.innerHTML = "";
    for(let i=1; i<=num; i++) {
        div.innerHTML += `<input type="text" id="p${i}" placeholder="プレイヤー${i}の名前">`;
    }
}

// モード切替
function setMode(m) {
    mode = m;
    document.getElementById('mode-random').style.background = m==='random' ? '#ffebee' : 'white';
    document.getElementById('mode-select').style.background = m==='select' ? '#ffebee' : 'white';
    document.getElementById('theme-selector-area').classList.toggle('hidden', m!=='select');
}

// データ保存
function save() { localStorage.setItem(KEY, JSON.stringify(themes)); updateSelect(); }

// 選択肢更新
function updateSelect() {
    const sel = document.getElementById('theme-select');
    sel.innerHTML = "";
    themes.forEach(t => {
        const op = document.createElement('option');
        op.value = t.t; op.text = t.t; sel.appendChild(op);
    });
}

// 追加・管理画面
function toggleAdd() { document.getElementById('add-form').classList.toggle('hidden'); document.getElementById('manage-form').classList.add('hidden'); }
function toggleManage() { 
    document.getElementById('manage-form').classList.toggle('hidden'); 
    document.getElementById('add-form').classList.add('hidden');
    renderManage();
}

function addTheme() {
    const t = document.getElementById('new-t').value;
    const min = document.getElementById('new-min').value;
    const max = document.getElementById('new-max').value;
    if(t && min && max) {
        themes.push({t, min, max}); save();
        document.getElementById('new-t').value = "";
        toggleAdd();
        alert("追加しました");
    }
}

function renderManage() {
    const list = document.getElementById('manage-list');
    list.innerHTML = "";
    themes.forEach((t, i) => {
        list.innerHTML += `<div class="manage-item">
            <span>${t.t}</span>
            <button onclick="delTheme(${i})" style="background:#333; color:white;">削除</button>
        </div>`;
    });
}
function delTheme(i) {
    if(confirm("削除しますか？")) { themes.splice(i,1); save(); renderManage(); }
}
function fullReset() {
    if(confirm("全て初期化しますか？")) { localStorage.removeItem(KEY); location.reload(); }
}

// ゲーム開始
function startGame() {
    const count = document.getElementById('player-count').value;
    players = [];
    
    // 1-100作成
    let nums = [];
    for(let i=1; i<=100; i++) nums.push(i);
    // シャッフル
    for(let i=nums.length-1; i>0; i--) {
        const r = Math.floor(Math.random()*(i+1));
        [nums[i], nums[r]] = [nums[r], nums[i]];
    }

    for(let i=1; i<=count; i++) {
        let name = document.getElementById(`p${i}`).value || `プレイヤー${i}`;
        players.push({name, val: nums[i-1]});
    }

    // お題決定
    let theme;
    if(mode === 'random') theme = themes[Math.floor(Math.random()*themes.length)];
    else {
        const val = document.getElementById('theme-select').value;
        theme = themes.find(t => t.t === val) || themes[0];
    }

    // 画面セット
    document.getElementById('game-theme').innerText = theme.t;
    document.getElementById('game-min').innerText = theme.min;
    document.getElementById('game-max').innerText = theme.max;
    
    curIdx = 0;
    showTurn();
    
    document.getElementById('screen-setup').classList.add('hidden');
    document.getElementById('screen-game').classList.remove('hidden');
}

function showTurn() {
    document.getElementById('turn-msg').innerText = `${players[curIdx].name} さんの番`;
    document.getElementById('card-area').classList.add('hidden');
    
    const btn = document.getElementById('btn-action');
    btn.innerText = "数字を見る";
    btn.onclick = showNum;
}

function showNum() {
    document.getElementById('my-num').innerText = players[curIdx].val;
    document.getElementById('card-area').classList.remove('hidden');
    
    const btn = document.getElementById('btn-action');
    btn.innerText = "隠して次へ";
    btn.onclick = nextTurn;
}

function nextTurn() {
    curIdx++;
    if(curIdx < players.length) {
        showTurn();
    } else {
        // 結果画面へ
        document.getElementById('screen-game').classList.add('hidden');
        document.getElementById('screen-result').classList.remove('hidden');
        
        const list = document.getElementById('res-list');
        players.sort((a,b) => a.val - b.val);
        players.forEach((p, i) => {
            list.innerHTML += `<li>${i+1}番目: <b>${p.val}</b> (${p.name})</li>`;
        });
    }
}
</script>
</body>
</html>
